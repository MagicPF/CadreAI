# CadreAI: version-pinned core environment based on the reported experiment environment.
# Not yet validated by a clean installation. Linux x86_64 recommended.
name: cadreai
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10.13
  - pip=25.0
  - openbabel=3.1.1
  - smina=2020.12.10
  - pip:
      - accelerate==1.3.0
      - biopython==1.84
      - boltz==0.4.1
      - gradio_client==1.3.0
      - huggingface_hub==0.36.2
      - loguru==0.7.3
      - meeko==0.6.1
      - numpy==1.26.3
      - openai==1.79.0
      - pandas==2.2.3
      - rdkit==2024.9.5
      - seaborn==0.13.2
      - torch==2.6.0
      - transformers==4.57.1
      - vina==1.2.7
      - ollama==0.4.8
      - datasets==3.6.0
      - scipy==1.13.1
      - scikit-learn==1.4.0
      - matplotlib==3.10.0
      - tqdm==4.67.1
